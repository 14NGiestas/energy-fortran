name = "fortran_energy"
version = "0.1.0"
license = "MIT"
author = "Ian Giestas Pauli"
maintainer = "Ian Giestas Pauli <iangiestas@usp.br>"
copyright = "Copyright 2026, Ian Giestas Pauli"
homepage = "https://github.com/14NGiestas/energy-fortran"
description = "In-process measurement of energy, power, CPU time and I/O for Fortran programs: joules, watts, cpu_s and cores_busy per run, phase and interval, read from Linux RAPL/hwmon and procfs with zero dependencies."
keywords = ["energy", "power", "rapl", "hwmon", "profiling", "hpc", "fortran", "mpi"]
categories = ["io", "os", "tools"]
# No dependencies at all: not even stdlib. The kernel is the interface
# (/sys/class/powercap, /sys/class/hwmon, /proc/self/{stat,status,io}) and libc is
# used only through iso_c_binding for readdir, because pure Fortran has no glob
# and shelling out for a directory listing would be worse (fork + quoting).
dependencies = {}

[build]
auto-executables = false
auto-examples = false
auto-tests = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[library]
source-dir = "src"

[[test]]
name = "test_energy"
source-dir = "test"
main = "test_energy.F90"

[[example]]
name = "measure_run"
source-dir = "examples"
main = "measure_run.f90"

[[example]]
name = "parity_load"
source-dir = "examples"
main = "parity_load.f90"

[install]
library = true
